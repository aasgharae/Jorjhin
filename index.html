<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کلمه‌ یاب ۵ حرفی</title>
<style>
  body{margin:0;background:#121213;color:#fff;font-family:Tahoma,sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100vh}
  #top{display:flex;align-items:center;justify-content:space-between;
       width:100%;max-width:500px;padding:10px 12px;box-sizing:border-box}
  h1{font-size:20px;margin:0}
  #new{padding:9px 16px;border:0;border-radius:8px;background:#d32f2f;color:#fff;
       font-family:inherit;font-size:14px;font-weight:bold}
  #msg{height:22px;color:#ffd54f;font-size:14px;margin:2px 0}
  #board{display:grid;gap:5px;margin:8px 0}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .cell{width:56px;height:56px;border:2px solid #3a3a3c;display:flex;
        align-items:center;justify-content:center;font-size:26px;font-weight:bold}
  .cell.f{border-color:#818384}
  .g{background:#538d4e;border-color:#538d4e}
  .y{background:#b59f3b;border-color:#b59f3b}
  .x{background:#3a3a3c;border-color:#3a3a3c}
  #kb{display:flex;flex-direction:column;gap:6px;margin:10px 4px 4px;width:100%;max-width:500px}
  .kr{display:flex;justify-content:center;gap:4px}
  .k{flex:1;max-width:40px;height:50px;border:0;border-radius:5px;background:#818384;
     color:#fff;font-size:16px;font-family:inherit}
  .k.wide{max-width:70px;font-size:13px;background:#6b6b6d}
  #submit{width:calc(100% - 16px);max-width:484px;height:60px;margin:6px 8px 20px;border:0;
          border-radius:10px;background:#2e9e3f;color:#fff;font-size:22px;font-weight:bold;
          font-family:inherit}
  #submit:active{background:#237a30}
</style>
</head>
<body>
<div id="top">
  <h1>کلمه‌ یاب ۵ حرفی</h1>
  <button id="new">بازی جدید</button>
</div>
<div id="msg"></div>
<div id="board"></div>
<div id="kb"></div>
<button id="submit">ثبت</button>

<script>
// ✏️ هرچقدر خواستی کلمه اضافه کن (فقط ۵ حرفی، بدون نیم‌فاصله، با ک و ی فارسی)
const WORDS = [...new Set(`
مدرسه پنجره آسمان ستاره باران پاییز گلدان پرنده کبوتر گنجشک خرگوش کرگدن زرافه میمون دلفین
مرغابی پروانه زنبور مورچه سنجاب خرچنگ شاگرد تکلیف بازار ماشین موتور رایانه برنامه عکاسی
نقاشی ترانه سینما نمایش دویدن پرواز قورمه انگور خربزه شیرین شکلات بستنی مهمان فرزند برادر
خواهر همکار بیمار آمپول درمان سلامت غمگین سنگین تاریک ارزان آهسته کوتاه باریک راهنما دیوار
تقویم شلوار جوراب دستکش عروسی مسافر آبشار جزیره طوفان زلزله سیاره سرباز پیروز آزادی عدالت
حقیقت راستی خاطره یادگار دلتنگ معشوق داستان مشتری کارگر مهندس معمار آهنگر خلبان ملوان
پژوهش آزمون آموزش فرهنگ تاریخ ریاضی فیزیک پزشکی هنرمند طراحی خوشبو باغچه ایوان صندلی
سماور بشقاب چنگال لیوان یخچال رادیو شطرنج جایزه کوشش صبوری شکیبا دلاور آزاده عزیزم
کتابچه دوچرخ سفیدی سیاهی قرمزی سبزه‌
`.split(/\s+/))].filter(w=>[...w].length===5);

const ROWS=["ضصثقفغعهخحجچ","شسیبلاتنمکگ","ظطزرذدپوژآ"];
const N=5, T=6;
let ans, cur, row, over, keyState;

const $=id=>document.getElementById(id);
const norm=c=>c==='ي'?'ی':c==='ك'?'ک':c;

function build(){
  $('board').innerHTML='';
  for(let r=0;r<T;r++){
    const d=document.createElement('div');d.className='row';
    for(let c=0;c<N;c++){const e=document.createElement('div');e.className='cell';d.appendChild(e)}
    $('board').appendChild(d);
  }
  $('kb').innerHTML='';
  ROWS.forEach((r,i)=>{
    const d=document.createElement('div');d.className='kr';
    [...r].forEach(ch=>d.appendChild(btn(ch,'',()=>type(ch))));
    if(i===2){d.appendChild(btn('حذف','wide',back))}
    $('kb').appendChild(d);
  });
}
function btn(t,cls,fn){const b=document.createElement('button');b.className='k '+cls;b.textContent=t;b.dataset.l=t;b.onclick=fn;return b}

function start(){
  ans=[...WORDS[Math.floor(Math.random()*WORDS.length)]];
  cur=[];row=0;over=false;keyState={};
  build();msg('');
}
function msg(t){$('msg').textContent=t}
function cells(){return $('board').children[row].children}
function type(ch){
  if(over||cur.length>=N)return;
  cur.push(ch);draw();
}
function back(){if(over)return;cur.pop();draw()}
function draw(){
  const cs=cells();
  for(let i=0;i<N;i++){cs[i].textContent=cur[i]||'';cs[i].classList.toggle('f',!!cur[i])}
}
function score(g){
  const res=Array(N).fill('x'), left={};
  for(let i=0;i<N;i++){
    if(g[i]===ans[i])res[i]='g';else left[ans[i]]=(left[ans[i]]||0)+1;
  }
  for(let i=0;i<N;i++){
    if(res[i]==='g')continue;
    if(left[g[i]]>0){res[i]='y';left[g[i]]--}
  }
  return res;
}
function submit(){
  if(over)return;
  if(cur.length<N){msg('کلمه باید ۵ حرف باشه!');return}
  const res=score(cur), cs=cells(), pr={x:1,y:2,g:3};
  res.forEach((s,i)=>{
    cs[i].classList.add(s);
    const l=cur[i];
    if(!keyState[l]||pr[s]>pr[keyState[l]])keyState[l]=s;
  });
  document.querySelectorAll('.k').forEach(b=>{
    const s=keyState[b.dataset.l];
    if(s){b.style.background={g:'#538d4e',y:'#b59f3b',x:'#3a3a3c'}[s]}
  });
  if(res.every(s=>s==='g')){msg('🎉 آفرین! درست زدی');over=true;return}
  row++;cur=[];
  if(row>=T){msg('باختی! کلمه: '+ans.join(''));over=true}
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter')submit();
  else if(e.key==='Backspace')back();
  else{const c=norm(e.key);if(ROWS.join('').includes(c))type(c)}
});
$('new').onclick=start;
$('submit').onclick=submit;
start();
</script>
</body>
</html>
