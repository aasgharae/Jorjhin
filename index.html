<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کلمه‌ یاب ۵ حرفی</title>
<style>
  :root{--ink:#5b4b8a;--line:#d8cdf0;--green:#a8e6cf;--yellow:#ffefa0;--gray:#dcd8ea}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:Tahoma,sans-serif;
       background:linear-gradient(160deg,#ffe3ee 0%,#e9e3ff 50%,#d9f3ff 100%);
       display:flex;flex-direction:column;align-items:center}
  #top{width:100%;max-width:500px;padding:12px;display:flex;align-items:center;justify-content:space-between}
  h1{font-size:19px;margin:0}
  #new{padding:9px 14px;border:0;border-radius:12px;background:#f67b8c;color:#fff;
       font-family:inherit;font-weight:bold;font-size:14px;box-shadow:0 3px 0 #d95f70}
  #new:active{transform:translateY(2px);box-shadow:0 1px 0 #d95f70}
  #stats{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;max-width:500px;padding:0 12px}
  .chip{background:#ffffffb8;border-radius:14px;padding:7px 12px;font-size:14px;font-weight:bold;
        box-shadow:0 2px 6px #b9a9e033}
  #hint{margin-right:auto;border:0;border-radius:14px;padding:8px 12px;font-family:inherit;
        font-size:13px;font-weight:bold;background:#ffe08a;color:#7a5b00;box-shadow:0 3px 0 #e0bf5c}
  #hint:disabled{opacity:.45;box-shadow:none}
  #msg{height:24px;margin:8px 0 2px;font-size:14px;font-weight:bold;color:#b0558a}
  #board{display:grid;gap:6px;margin:4px 0}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .row.shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(7px)}50%{transform:translateX(-7px)}75%{transform:translateX(5px)}}
  .cell{width:58px;height:58px;border:2px solid var(--line);border-radius:14px;background:#ffffffcc;
        display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:bold}
  .cell.f{border-color:#b7a4e6;animation:pop .12s}
  @keyframes pop{50%{transform:scale(1.1)}}
  .cell.g{background:var(--green);border-color:var(--green)}
  .cell.y{background:var(--yellow);border-color:var(--yellow)}
  .cell.x{background:var(--gray);border-color:var(--gray)}
  #kb{display:flex;flex-direction:column;gap:6px;margin:12px 4px 4px;width:100%;max-width:500px;padding:0 4px}
  .kr{display:flex;justify-content:center;gap:4px}
  .k{flex:1;min-width:0;max-width:40px;height:48px;border:0;border-radius:10px;background:#fff;
     color:var(--ink);font-size:16px;font-family:inherit;box-shadow:0 2px 0 #cfc3ee}
  .k:active{transform:translateY(1px)}
  .k.wide{max-width:64px;font-size:13px;background:#f3ecff}
  .k.kg{background:var(--green)} .k.ky{background:var(--yellow)} .k.kx{background:var(--gray);color:#9a93b5}
  #submit{width:calc(100% - 20px);max-width:480px;height:62px;margin:8px 10px 22px;border:0;border-radius:18px;
          background:#6fd69c;color:#fff;font-size:23px;font-weight:bold;font-family:inherit;
          box-shadow:0 4px 0 #4fb97d}
  #submit:active{transform:translateY(3px);box-shadow:0 1px 0 #4fb97d}
  .star-pop{animation:sp .6s}
  @keyframes sp{50%{transform:scale(1.35)}}
</style>
</head>
<body>
<div id="top">
  <h1>🌸 کلمه‌ یاب ۵ حرفی</h1>
  <button id="new">بازی جدید</button>
</div>
<div id="stats">
  <div class="chip" id="stars">⭐ ۰</div>
  <div class="chip" id="solved">✅ ۰</div>
  <button id="hint">💡 راهنمایی (۵⭐)</button>
</div>
<div id="msg"></div>
<div id="board"></div>
<div id="kb"></div>
<button id="submit">ثبت</button>

<script>
/* ============ دیکشنری ============
   ANSWERS: کلمه‌هایی که ممکنه جواب بشن (آشنا و رایج)
   EXTRA: کلمه‌های دیگه که فقط به‌عنوان حدس قبول می‌شن
   هرچی اضافه کنی بهتر می‌شه. فاصله یا خط جدید بینشون بذار.
   کلمه‌ی غیر ۵ حرفی یا با حرف نامعتبر خودکار حذف می‌شه. */
const ANSWERS = `
مدرسه پنجره آسمان ستاره باران پاییز گلدان پرنده کبوتر گنجشک خرگوش کرگدن زرافه میمون دلفین
زنبور مورچه سنجاب خرچنگ شاگرد تکلیف بازار ماشین موتور عکاسی نقاشی ترانه سینما نمایش دویدن
پرواز قورمه انگور خربزه شیرین شکلات بستنی مهمان فرزند برادر خواهر همکار بیمار آمپول درمان
سلامت غمگین سنگین تاریک ارزان آهسته کوتاه باریک راهنما دیوار تقویم شلوار جوراب دستکش عروسی
مسافر آبشار جزیره طوفان زلزله سیاره سرباز پیروز آزادی عدالت حقیقت راستی خاطره معشوق داستان
مشتری کارگر مهندس معمار آهنگر خلبان ملوان پژوهش آزمون آموزش فرهنگ تاریخ ریاضی فیزیک پزشکی
طراحی خوشبو باغچه ایوان صندلی سماور بشقاب چنگال لیوان یخچال رادیو شطرنج جایزه کوشش صبوری
شکیبا دلاور آزاده دارچین لوبیا سوهان باقلوا کوفته امتحان دستبند کاپشن پالتو مزرعه باغبان
گلبرگ شکوفه شقایق ریحان خروس شاهین قناری روباه گورخر دوستی عاشقی حافظه بخشش سخاوت شرافت
ایمیل تصویر گیتار پیانو ویولن تنبور سنتور نانوا بخاری فنجان تاکسی میدان کپسول عارضه تزریق
صورتی طلایی طبیعت دقیقه ثانیه بامداد صبحگاه شامگاه بزرگی نزدیک پایین بیرون مقابل نگران
آرامش فریاد زمزمه لبخند چشمان دستان انگشت شیشه
`;
const EXTRA = `
تهران شیراز تبریز کرمان اهواز قزوین همدان کاشان بوشهر سمنان مدارس
`;

const LETTERS="ضصثقفغعهخحجچشسیبلاتنمکگظطزرذدپوژآ";
const ROWS=["ضصثقفغعهخحجچ","شسیبلاتنمکگ","ظطزرذدپوژآ"];
const N=5, T=6;
const norm=c=>c==='ي'?'ی':c==='ك'?'ک':c;
const parse=s=>s.split(/\s+/).map(w=>[...w].map(norm).join(''))
  .filter(w=>[...w].length===N&&[...w].every(c=>LETTERS.includes(c)));
const ANS=[...new Set(parse(ANSWERS))];
const VALID=new Set([...ANS,...parse(EXTRA)]);

const $=id=>document.getElementById(id);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

let save={stars:0,solved:0};
try{const s=JSON.parse(localStorage.getItem('wf5'));if(s)save=s}catch(e){}
function persist(){try{localStorage.setItem('wf5',JSON.stringify(save))}catch(e){}}
function showStats(pop){
  $('stars').textContent='⭐ '+fa(save.stars);
  $('solved').textContent='✅ '+fa(save.solved);
  $('hint').disabled=over||save.stars<5;
  if(pop){$('stars').classList.remove('star-pop');void $('stars').offsetWidth;$('stars').classList.add('star-pop')}
}

let ans,cur,row,over=false,keyState,bag=[];
function nextWord(){
  if(!bag.length){bag=[...ANS];for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
  return bag.pop();
}
function btn(t,cls,fn){const b=document.createElement('button');b.className='k '+cls;b.textContent=t;b.dataset.l=t;b.onclick=fn;return b}
function build(){
  $('board').innerHTML='';
  for(let r=0;r<T;r++){
    const d=document.createElement('div');d.className='row';
    for(let c=0;c<N;c++){const e=document.createElement('div');e.className='cell';d.appendChild(e)}
    $('board').appendChild(d);
  }
  $('kb').innerHTML='';
  ROWS.forEach((r,i)=>{
    const d=document.createElement('div');d.className='kr';
    [...r].forEach(ch=>d.appendChild(btn(ch,'',()=>type(ch))));
    if(i===2)d.appendChild(btn('حذف','wide',back));
    $('kb').appendChild(d);
  });
}
function start(){
  ans=[...nextWord()];cur=[];row=0;over=false;keyState={};
  build();msg('');$('submit').textContent='ثبت';showStats();
}
function msg(t){$('msg').textContent=t}
function cells(){return $('board').children[row].children}
function type(ch){if(over||cur.length>=N)return;cur.push(ch);draw()}
function back(){if(over)return;cur.pop();draw()}
function draw(){const cs=cells();for(let i=0;i<N;i++){cs[i].textContent=cur[i]||'';cs[i].classList.toggle('f',!!cur[i])}}
function score(g){
  const res=Array(N).fill('x'),left={};
  for(let i=0;i<N;i++){if(g[i]===ans[i])res[i]='g';else left[ans[i]]=(left[ans[i]]||0)+1}
  for(let i=0;i<N;i++){if(res[i]==='g')continue;if(left[g[i]]>0){res[i]='y';left[g[i]]--}}
  return res;
}
function paintKeys(){
  document.querySelectorAll('.k').forEach(b=>{
    b.classList.remove('kg','ky','kx');
    const s=keyState[b.dataset.l];
    if(s)b.classList.add('k'+s);
  });
}
function submit(){
  if(over){start();return}
  if(cur.length<N){msg('کلمه باید ۵ حرف باشه!');return}
  const word=cur.join('');
  if(!VALID.has(word)){
    msg('این کلمه تو دیکشنری نیست 🤔');
    const r=$('board').children[row];r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');
    return;
  }
  const res=score(cur),cs=cells(),pr={x:1,y:2,g:3};
  res.forEach((s,i)=>{
    cs[i].classList.add(s);
    const l=cur[i];
    if(!keyState[l]||pr[s]>pr[keyState[l]])keyState[l]=s;
  });
  paintKeys();
  if(res.every(s=>s==='g')){
    save.stars++;save.solved++;persist();over=true;
    msg('🎉 آفرین! یه ستاره گرفتی ⭐');
    $('submit').textContent='بازی بعدی';showStats(true);return;
  }
  row++;cur=[];
  if(row>=T){over=true;msg('باختی! جواب: '+ans.join(''));$('submit').textContent='بازی بعدی';showStats()}
}
function hint(){
  if(over)return;
  if(save.stars<5){msg('ستاره‌ت کمه!');return}
  const c=[...new Set(ans)].filter(l=>keyState[l]!=='g'&&keyState[l]!=='y');
  if(!c.length){msg('همه‌ی حروف جواب رو قبلاً پیدا کردی 😄');return}
  const l=c[Math.floor(Math.random()*c.length)];
  keyState[l]='y';save.stars-=5;persist();paintKeys();showStats();
  msg('💡 یه حرف درست زرد شد');
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter')submit();
  else if(e.key==='Backspace')back();
  else{const c=norm(e.key);if(c.length===1&&LETTERS.includes(c))type(c)}
});
$('new').onclick=start;
$('submit').onclick=submit;
$('hint').onclick=hint;
start();
</script>
</body>
</html>
